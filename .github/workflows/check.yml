name: Conformance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: op-spec
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cogcloud-ai/cog-smith
          # The reference implementation: cog-smith Op machinery 0.11.0, which implements [0.2].
          ref: 25e1c23dc3bafd272b0adf7212d307ddc2cd9707
          path: cog-smith
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.69.0
          manifest-path: op-spec/pixi.toml
      - name: Corpus, examples, and envelope and validator fixtures
        working-directory: op-spec
        run: pixi run check
      - name: Compare with the reference implementation
        working-directory: op-spec
        run: pixi run check-reference ../cog-smith/templates/op/src/op_spec.py
      - name: Validate examples against the core
        working-directory: op-spec
        shell: bash
        run: for op in examples/*/; do pixi run validate "$op"; done
