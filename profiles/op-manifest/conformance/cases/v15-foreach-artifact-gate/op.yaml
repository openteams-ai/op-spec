schema: openteams/op-manifest [0.2]
id: example.org/op-conformance
version: 0.1.0
title: Conformance case
inputs:
- name: texts
  required: true
  schema:
    type: array
steps:
- id: tally
  cog:
    id: example.org/cog-word-tally
    version: 0.1.0
    source: ../cog-word-tally
    task: tally
  input:
    text:
      $from: text
  foreach:
    items:
      $from: inputs.texts
    as: text
  gate:
    policy: human
    decides: artifact
    artifact:
      kind: tally-set
      digests:
        tallies:
          $sha256:
            $from: steps.tally.payload
