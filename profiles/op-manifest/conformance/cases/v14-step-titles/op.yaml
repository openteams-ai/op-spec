schema: openteams/op-manifest [0.2]
id: example.org/op-conformance
version: 0.1.0
title: Conformance case
inputs:
- name: texts
  required: true
  schema:
    type: array
- name: max_attempts
  required: false
  default: 3
  schema:
    type: integer
steps:
- id: tally
  cog:
    id: example.org/cog-word-tally
    version: 0.1.0
    source: ../cog-word-tally
    task: tally
  input:
    texts:
      $from: inputs.texts
  title: Tally the words
- id: summarize
  depends_on:
  - tally
  cog:
    id: example.org/cog-summarizer
    version: 0.1.0
    source: ../cog-summarizer
    task: summarize
  input:
    counts:
      $from: steps.tally.payload.counts
  title: Summarize the tally
cycle:
  outcome_step: summarize
  outcome_field: verdict
  max_attempts:
    $from: inputs.max_attempts
  max_cost_units: 10
  costs:
    tally: 0
    summarize: 1
    note-revision: 1
  transitions:
    revise:
      restart: summarize
      prepare:
      - id: note-revision
        title: Note what the revision changes
        cog:
          id: example.org/cog-summarizer
          version: 0.1.0
          source: ../cog-summarizer
          task: summarize
        input:
          counts:
            $from: inputs.cycle_previous.steps.tally.payload.counts
