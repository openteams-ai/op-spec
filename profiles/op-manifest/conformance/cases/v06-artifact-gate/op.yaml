schema: openteams/op-manifest [0.2]
id: example.org/op-conformance
version: 0.1.0
name: Conformance case
inputs:
- name: texts
  required: true
  schema:
    type: array
steps:
- id: design
  cog:
    id: example.org/cog-author
    version: 0.1.0
    source: ../cog-author
    task: design
  input:
    brief:
      $from: inputs.texts
  gate:
    policy: human
    decides: artifact
    artifact:
      kind: cog-contract
      summary:
        $from: steps.design.payload.contract.purpose
      digests:
        contract:
          $sha256:
            $from: steps.design.payload.contract
- id: author
  depends_on:
  - design
  cog:
    id: example.org/cog-author
    version: 0.1.0
    source: ../cog-author
    task: author
  input:
    contract_sha256:
      $from: steps.design.decision.artifact.digests.contract
