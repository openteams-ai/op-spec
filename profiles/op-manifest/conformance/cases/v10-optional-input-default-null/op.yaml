schema: openteams/op-manifest [0.2]
id: example.org/op-conformance
version: 0.1.0
title: Conformance case
inputs:
- name: texts
  required: true
  schema:
    type: array
- name: note
  required: false
  default: null
  schema:
    type:
    - string
    - 'null'
steps:
- id: tally
  cog:
    id: example.org/cog-word-tally
    version: 0.1.0
    source: ../cog-word-tally
    task: tally
  input:
    texts:
      $from: inputs.texts
    note:
      $from: inputs.note
      $default: null
