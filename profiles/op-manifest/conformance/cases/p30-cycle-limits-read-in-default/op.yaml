schema: openteams/op-manifest [0.2]
id: example.org/op-conformance
version: 0.1.0
title: Conformance case
inputs:
- name: texts
  required: true
  schema:
    type: array
- name: max_attempts
  required: false
  default: 3
  schema:
    type: integer
steps:
- id: tally
  cog:
    id: example.org/cog-word-tally
    version: 0.1.0
    source: ../cog-word-tally
    task: tally
  input:
    texts:
      $from: inputs.texts
- id: summarize
  depends_on:
  - tally
  cog:
    id: example.org/cog-summarizer
    version: 0.1.0
    source: ../cog-summarizer
    task: summarize
  input:
    counts:
      $from: steps.tally.payload.counts
cycle:
  outcome_step: summarize
  outcome_field: verdict
  max_attempts:
    $from: inputs.max_attempts
  max_cost_units:
    $from: inputs.max_attempts
    $default:
      $from: run.id
  costs:
    tally: 0
    summarize: 1
  transitions:
    revise:
      restart: summarize
