schema: openteams/op-manifest [0.2]
id: example.org/op-conformance
version: 0.1.0
name: Conformance case
inputs:
- name: texts
  required: true
  schema:
    type: array
steps:
- id: tally
  cog:
    id: example.org/cog-word-tally
    version: 0.1.0
    source: ../cog-word-tally
    task: tally
  input:
    texts:
      $from: inputs.texts
    output_dir:
      $run_dir: tally/out
- id: summarize
  depends_on:
  - tally
  cog:
    id: example.org/cog-summarizer
    version: 0.1.0
    source: ../cog-summarizer
    task: summarize
  input:
    counts:
      $from: steps.tally.payload.counts
outputs:
  summary:
    $from: steps.summarize.payload
