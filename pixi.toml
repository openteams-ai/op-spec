[workspace]
name = "op-spec"
version = "0.1.0"
description = "Op Spec: a portable composition of Cogs, its step result envelope, and execution profiles."
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = ">=3.11"
pyyaml = "*"
jsonschema = ">=4.18"

[tasks]
check = "python tools/check_conformance.py"
check-reference = "python tools/check_conformance.py --reference"
validate = "python tools/validate_op.py"
